<style>
:root{--navy:#123b5d;--blue:#176b9b;--bg:#f3f6f9;--ink:#172b3a;--muted:#647789;--line:#dce5ec;--green:#16845b;--red:#bd3b3b}body[data-theme="verde"]{--navy:#155b45;--blue:#16845b;--bg:#f1f7f3}body[data-theme="roxo"]{--navy:#49346f;--blue:#7652a8;--bg:#f6f3fa}body[data-theme="escuro"]{--navy:#101b2a;--blue:#3979b9;--bg:#101923;--ink:#e7edf4;--muted:#a9b7c6;--line:#344454}body[data-theme="escuro"] .panel,body[data-theme="escuro"] .metric,body[data-theme="escuro"] input,body[data-theme="escuro"] select{background:#1b2938;color:#e7edf4;border-color:#344454}body[data-theme="escuro"] .tabs button{background:#26384a;color:#e7edf4}body[data-theme="escuro"] .tabs button.active{background:var(--navy)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;background:var(--blue);color:#fff;font-weight:650}.secondary{background:#e7eef4;color:var(--navy)}.danger{background:#b43b3b}.shell{max-width:1150px;margin:auto;padding:14px}.top{background:var(--navy);color:#fff;padding:16px;border-radius:14px;display:flex;justify-content:space-between;align-items:center;gap:12px}.top small{opacity:.8}.tabs{display:flex;gap:7px;overflow:auto;padding:12px 0}.tabs button{white-space:nowrap;background:#e2eaf0;color:var(--navy)}.tabs button.active{background:var(--navy);color:#fff}.panel{background:white;border:1px solid var(--line);border-radius:13px;padding:15px;margin:8px 0 14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric{background:#f7fafc;border:1px solid var(--line);padding:13px;border-radius:11px}.metric b{display:block;font-size:1.18rem;margin-top:5px}.muted{color:var(--muted);font-size:.88rem}h2{font-size:1.2rem;margin:4px 0 12px}h3{font-size:1rem;margin:0 0 9px}label{display:block;font-size:.88rem;color:var(--muted);margin:9px 0 4px}input,select{width:100%;padding:11px;border:1px solid #cbd7e0;border-radius:8px;background:white;color:var(--ink)}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);font-weight:650}.empty{padding:18px;text-align:center;color:var(--muted)}.hide{display:none!important}.pill{display:inline-block;padding:3px 8px;border-radius:20px;background:#e7f4ed;color:var(--green);font-size:.78rem}.warning{color:#a55b00}.bad{color:var(--red)}.login{max-width:390px;margin:12vh auto}.smallbtn{padding:6px 9px;font-size:.8rem}.receipt{font-family:Arial,sans-serif;color:#111;background:#fff;padding:18px;max-width:700px;margin:auto}.receipt h2{text-align:center}.receipt .center{text-align:center}.total-line{display:flex;justify-content:space-between;padding:5px 0}.foot{text-align:center;color:var(--muted);font-size:.8rem;padding:18px}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.shell{padding:22px}.panel{padding:20px}}@media print{body{background:#fff}.no-print{display:none!important}#receiptArea{display:block!important}.receipt{max-width:none}}

/* V7 — identidade visual renovada */
:root{--accent:#1676c5;--accent2:#28a4d8;--shadow:0 10px 28px rgba(18,59,93,.09);--radius:18px}
body{background:radial-gradient(ellipse at 10% 0%,rgba(40,164,216,.09),transparent 36%),var(--bg);font-size:var(--app-font,15px);transition:background .2s,color .2s}
.shell{max-width:1280px;padding:16px}
.top{background:linear-gradient(120deg,var(--navy),var(--blue),var(--accent));border-radius:20px;padding:20px 22px;box-shadow:0 12px 28px rgba(10,48,82,.2);position:relative;overflow:hidden}
.top:after{content:"";position:absolute;width:190px;height:190px;border:1px solid #ffffff25;border-radius:50%;right:-45px;top:-100px;box-shadow:0 0 0 24px #ffffff0c,0 0 0 48px #ffffff08;pointer-events:none}
.top strong{font-size:1.22rem;letter-spacing:.2px}.top small{font-size:.82rem}
.tabs{padding:14px 2px 16px;gap:8px;scrollbar-width:thin}
.tabs button{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:rgba(255,255,255,.78);box-shadow:0 2px 7px #102c4410;transition:transform .16s,box-shadow .16s,background .16s}
.tabs button:hover{transform:translateY(-2px);box-shadow:0 6px 14px #102c4418}.tabs button.active{background:linear-gradient(120deg,var(--navy),var(--blue));box-shadow:0 5px 14px #123b5d35}
.panel{border:1px solid color-mix(in srgb,var(--line) 80%,transparent);border-radius:var(--radius);padding:18px;margin:10px 0 16px;box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s}
.panel h3{font-size:1.02rem;letter-spacing:.1px}.metric{border:1px solid var(--line);border-radius:16px;padding:16px;background:linear-gradient(145deg,#fff,#f5f9fc);box-shadow:0 5px 15px #102c4409;position:relative;overflow:hidden;transition:transform .18s,box-shadow .18s}.metric:hover{transform:translateY(-3px);box-shadow:0 10px 22px #102c4418}.metric b{font-size:1.28rem;color:var(--navy);overflow-wrap:anywhere}
button{border-radius:11px;padding:11px 16px;background:linear-gradient(120deg,var(--blue),var(--accent));box-shadow:0 4px 10px #123b5d20;transition:transform .16s,filter .16s}button:hover{filter:brightness(1.06);transform:translateY(-1px)}button:active{transform:translateY(0)}.secondary{background:#e9f0f6;color:var(--navy);box-shadow:none}.danger{background:linear-gradient(120deg,#a92d3a,#d34c55)}
input,select{border-radius:11px;padding:12px;border-color:var(--line);transition:border .15s,box-shadow .15s}input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
table{border-collapse:separate;border-spacing:0}th{background:color-mix(in srgb,var(--bg) 82%,var(--blue) 18%)}th:first-child{border-radius:9px 0 0 0}th:last-child{border-radius:0 9px 0 0}td,th{padding:11px 10px}tr:hover td{background:color-mix(in srgb,var(--bg) 80%,var(--blue) 8%)}
.login{max-width:420px;margin:9vh auto;padding:28px;border:1px solid #ffffffaa;border-radius:26px;background:linear-gradient(145deg,#fffffffa,#eef6fcf2);box-shadow:0 24px 70px #062c4a35;position:relative;overflow:hidden}.login:before{content:"";position:absolute;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,#4eb9f477,transparent 68%);right:-95px;top:-115px;pointer-events:none}.login h2{font-size:1.65rem;color:#123b5d;margin:4px 0}.login .brandmark{width:58px;height:58px;border-radius:18px;background:linear-gradient(145deg,#123b5d,#2099ce);display:grid;place-items:center;color:white;font-weight:900;font-size:1.2rem;box-shadow:0 8px 20px #123b5d35;margin-bottom:16px}.login .actions button{flex:1}.login .cancel{background:#e7eef4;color:#27465e;box-shadow:none}.foot{padding:24px 10px}.settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.setting-tile{border:1px solid var(--line);border-radius:14px;padding:14px;background:color-mix(in srgb,var(--bg) 55%,white);margin:8px 0}.setting-tile strong{display:block;margin-bottom:5px}.color-row{display:flex;gap:10px;flex-wrap:wrap}.color-dot{width:34px;height:34px;border-radius:50%;padding:0;border:3px solid white;box-shadow:0 0 0 1px #9aabb8;min-width:34px}.color-dot.selected{box-shadow:0 0 0 3px var(--accent)}
body[data-theme="escuro"] .metric{background:linear-gradient(145deg,#1b2938,#202f40)}body[data-theme="escuro"] .metric b{color:#d9ecff}body[data-theme="escuro"] .setting-tile{background:#1b2938}body[data-theme="escuro"] .login{background:#1b2938;color:#e7edf4;border-color:#344454}body[data-theme="escuro"] .login h2{color:#e7edf4}
@media(max-width:600px){.shell{padding:10px}.top{padding:16px;border-radius:16px}.tabs button{padding:9px 12px;font-size:.86rem}.panel{padding:14px;border-radius:15px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.metric{padding:12px}.metric b{font-size:1.05rem}.login{margin:7vh 14px;padding:22px}}


/* V7.2 — cores semânticas e indicadores de desempenho */
.value-sales,.value-positive{color:#16845b!important}.value-stock,.value-info{color:#176bba!important}.value-warning{color:#b66a00!important}.value-negative{color:#bd3b3b!important}.value-neutral{color:#7652a8!important}
.metric.sales-metric{border-left:5px solid #16845b}.metric.profit-metric{border-left:5px solid #176bba}.metric.expense-metric{border-left:5px solid #bd3b3b}.metric.debt-metric{border-left:5px solid #b66a00}.metric.stock-metric{border-left:5px solid #7652a8}
.stat-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:8px;background:color-mix(in srgb,currentColor 9%,transparent);font-weight:750}.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:.82rem;color:var(--muted)}.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}.product-rank{font-weight:750;color:#16845b}

/* V7.2 — cores semânticas nas páginas de dívidas, devoluções e relatórios */
.metric.debt-metric{border-left:5px solid #c47a12;background:linear-gradient(145deg,#fffaf0,#fff4df)}
.metric.return-metric{border-left:5px solid #8b5ac2;background:linear-gradient(145deg,#fbf7ff,#f2eaff)}
.metric.refund-metric{border-left:5px solid #bd3b3b;background:linear-gradient(145deg,#fff8f8,#ffeded)}
.metric.report-sales{border-left:5px solid #16845b}.metric.report-cost{border-left:5px solid #bd3b3b}.metric.report-profit{border-left:5px solid #176bba}.metric.report-debt{border-left:5px solid #c47a12}.metric.report-received{border-left:5px solid #16845b}
.value-debt{color:#b66a00!important}.value-return{color:#7652a8!important}.value-refund{color:#bd3b3b!important}.value-expense{color:#bd3b3b!important}.value-quantity{color:#176bba!important}
.page-legend{display:flex;flex-wrap:wrap;gap:7px 14px;margin:0 0 12px;padding:9px 11px;border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--bg) 65%,white);font-size:.82rem;color:var(--muted)}
.page-legend span{display:inline-flex;align-items:center;gap:6px}.page-legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
body[data-theme="escuro"] .metric.debt-metric,body[data-theme="escuro"] .metric.return-metric,body[data-theme="escuro"] .metric.refund-metric{background:#1b2938}
</style></head><body>
<div id="login" class="login panel"><div class="brandmark">MG</div><h2>Meu Gestor de Negócios</h2><p class="muted">Organize. Controle. Cresça.</p><label>PIN de acesso</label><input id="pin" type="password" inputmode="numeric" placeholder="Introduza o seu PIN" onkeydown="if(event.key==='Enter')login()"><div class="actions"><button onclick="login()">Entrar</button><button class="cancel" onclick="cancelLogin()">Cancelar</button></div><p id="loginErr" class="muted"></p><p class="muted">Acesso protegido • Funcionamento offline</p></div>
<div id="app" class="shell hide"><header class="top"><div><strong id="brand">Minha Empresa</strong><br><small id="subbrand">Luena, Moxico • Kz</small></div><button class="secondary" onclick="logout()">Sair</button></header><nav class="tabs no-print" id="tabs"></nav><main id="view"></main><div class="foot">Meu Gestor de Negócios V8.0 • Aplicação Android offline • Dados guardados neste dispositivo</div></div><div id="receiptArea" class="hide"></div>
<script>
'use strict';
const KEY='minha_empresa_v1';
const initial={settings:{name:'Minha Empresa',nif:'04884i4677',address:'Luena, Moxico',currency:'Kz',pin:'1234',theme:'azul',accent:'#1676c5',fontSize:'15',autoLock:0,showMetrics:['Vendas realizadas','Lucro estimado','Despesas registadas','Dívidas por receber','Produtos cadastrados','Clientes','Vendas registadas','Stock total']},products:[],clients:[],sales:[],expenses:[],stockMoves:[],payments:[],debts:[]};
function normalize(x){const d={...initial,...(x||{})};d.settings={...initial.settings,...(x?.settings||{})};if(!Array.isArray(d.settings.showMetrics))d.settings.showMetrics=initial.settings.showMetrics.slice();for(const k of ['products','clients','sales','expenses','stockMoves','payments','debts','returns'])if(!Array.isArray(d[k]))d[k]=[];d.sales=d.sales.map(s=>({...s,discount:s.discount||0,subtotal:s.subtotal??s.total??0,paid:s.paid??s.total??0,due:s.due??0,paymentMethod:s.paymentMethod||'Dinheiro',payments:Array.isArray(s.payments)?s.payments:[],items:(s.items||[]).map(i=>({...i,discount:i.discount||0,lineTotal:i.lineTotal??i.qty*i.price}))}));return d}
function load(){try{return normalize(JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return normalize(initial)}}let db=load(),page='Início',saleCart=[];
function save(){localStorage.setItem(KEY,JSON.stringify(db))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(n){return Number(n||0).toLocaleString('pt-PT',{minimumFractionDigits:2,maximumFractionDigits:2})+' '+db.settings.currency}function today(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}function id(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}function val(k){return document.getElementById(k)?.value?.trim()||''}function num(k){return Number(val(k)||0)}function sum(a,f){return a.reduce((n,x)=>n+f(x),0)}
function login(){if(val('pin')===db.settings.pin){document.getElementById('login').classList.add('hide');document.getElementById('app').classList.remove('hide');render();resetIdleTimer()}else{document.getElementById('loginErr').textContent='PIN incorrecto. Verifique e tente novamente.';document.getElementById('pin').focus();document.getElementById('pin').select()}}function cancelLogin(){document.getElementById('pin').value='';document.getElementById('loginErr').textContent='';document.getElementById('pin').focus()}function logout(){document.getElementById('app').classList.add('hide');document.getElementById('login').classList.remove('hide');document.getElementById('pin').value='';cancelLogin();clearTimeout(idleTimer)}
const pages=['Início','Produtos','Clientes','Vendas','Dívidas','Devoluções','Despesas','Facturas','Relatórios','Configurações'];function nav(){document.getElementById('tabs').innerHTML=pages.map(p=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${p}</button>`).join('')}function go(p){page=p;render()}function render(){document.body.dataset.theme=db.settings.theme||'azul';document.documentElement.style.setProperty('--accent',db.settings.accent||'#1676c5');document.documentElement.style.setProperty('--app-font',(db.settings.fontSize||15)+'px');nav();document.getElementById('brand').textContent=db.settings.name;document.getElementById('subbrand').textContent=db.settings.address+' • '+db.settings.currency;document.getElementById('view').innerHTML=({'Início':home,'Produtos':products,'Clientes':clients,'Vendas':sales,'Dívidas':debtsPage,'Devoluções':returnsPage,'Despesas':expenses,'Facturas':invoices,'Relatórios':reports,'Configurações':settings})[page]();if(page==='Relatórios')drawReportChart()}
function outstanding(){return sum(db.sales,s=>Math.max(0,Number(s.due)||0))}function revenue(){return Math.max(0,sum(db.sales,s=>Number(s.total)||0))}function expensesTotal(){return sum(db.expenses,e=>Number(e.amount)||0)}function costTotal(){return sum(db.sales,s=>sum(s.items||[],i=>Number(i.qty)*Number(i.cost)))}
function productStats(pid){let qty=0,amount=0;db.sales.forEach(s=>{const items=s.items||[],base=sum(items,i=>Number(i.lineTotal??(Number(i.qty)*Number(i.price)))||0),factor=base>0?Math.max(0,Number(s.total)||0)/base:0;items.forEach(i=>{if(i.productId===pid){qty+=Number(i.qty)||0;amount+=(Number(i.lineTotal??(Number(i.qty)*Number(i.price)))||0)*factor}})});return {qty,amount}}
function productStatsAll(){return db.products.map(p=>({product:p,...productStats(p.id)})).sort((a,b)=>b.amount-a.amount)}
function home(){const rev=revenue(),exp=expensesTotal(),cost=costTotal(),due=outstanding();const all=[['Vendas realizadas',money(rev),'sales-metric','value-sales'],['Lucro estimado',money(rev-cost-exp),'profit-metric','value-info'],['Despesas registadas',money(exp),'expense-metric','value-negative'],['Dívidas por receber',money(due),'debt-metric','value-warning'],['Produtos cadastrados',db.products.length,'','value-neutral'],['Clientes',db.clients.length,'','value-info'],['Vendas registadas',db.sales.length,'','value-sales'],['Stock total',sum(db.products,p=>Number(p.stock)||0),'stock-metric','value-stock']];const shown=db.settings.showMetrics||all.map(x=>x[0]);const top=productStatsAll().slice(0,5);return `<h2>Painel de controlo</h2><div class="grid">${all.filter(x=>shown.includes(x[0])).map(x=>`<div class="metric ${x[2]}">${x[0]}<b class="${x[3]}">${x[1]}</b></div>`).join('')}</div><section class="panel"><h3>Desempenho dos produtos mais vendidos</h3><div class="tablewrap"><table><tr><th>Produto</th><th>Unidades vendidas</th><th>Valor vendido</th></tr>${top.map(x=>`<tr><td>${esc(x.product.name)}</td><td><b class="value-info">${x.qty} ${esc(x.product.unit||'un.')}</b></td><td><b class="value-sales">${money(x.amount)}</b></td></tr>`).join('')||'<tr><td colspan="3" class="empty">Ainda não existem vendas por produto.</td></tr>'}</table></div></section><section class="panel"><h3>Alertas de stock baixo</h3>${db.products.filter(p=>Number(p.stock)<=Number(p.min)).map(p=>`<p>${esc(p.name)} — <b class="warning">${p.stock} ${esc(p.unit)}</b></p>`).join('')||'<p class="muted">Nenhum produto abaixo do mínimo.</p>'}</section><section class="panel"><h3>Últimas vendas</h3>${db.sales.slice(-5).reverse().map(s=>`<p>${s.date} • ${esc(s.clientName)} • <b class="value-sales">${money(s.total)}</b> • ${s.due>0?'<span class="bad">Em dívida: '+money(s.due)+'</span>':'<span class="pill">Liquidada</span>'}</p>`).join('')||'<p class="muted">Ainda não existem vendas.</p>'}</section>`}
function products(){const stats=productStatsAll();return `<h2>Produtos e stock</h2><section class="panel"><h3>Novo produto</h3><div class="row"><div><label>Nome</label><input id="pname"></div><div><label>Código</label><input id="pcode"></div><div><label>Preço de venda (Kz)</label><input id="pprice" type="number" min="0"></div><div><label>Custo unitário (Kz)</label><input id="pcost" type="number" min="0"></div><div><label>Quantidade inicial</label><input id="pstock" type="number" min="0" value="0"></div><div><label>Stock mínimo</label><input id="pmin" type="number" min="0" value="5"></div></div><label>Unidade</label><select id="punit"><option>un.</option><option>kg</option><option>litro</option><option>caixa</option><option>pacote</option></select><div class="actions"><button onclick="addProduct()">Guardar produto</button></div></section><section class="panel"><h3>Resumo de vendas por produto</h3><div class="legend"><span><i style="background:#16845b"></i> Valor vendido</span><span><i style="background:#176bba"></i> Quantidade vendida</span><span><i style="background:#b66a00"></i> Stock baixo</span></div><div class="tablewrap"><table><tr><th>Produto</th><th>Preço</th><th>Stock actual</th><th>Quantidade vendida</th><th>Total vendido</th><th>Acção</th></tr>${stats.map(x=>{const p=x.product;return `<tr><td>${esc(p.name)}<br><small>${esc(p.code)}</small></td><td><b class="value-info">${money(p.price)}</b></td><td><b class="${p.stock<=p.min?'value-warning':'value-stock'}">${p.stock} ${esc(p.unit)} ${p.stock<=p.min?'• Baixo':''}</b></td><td><b class="value-info">${x.qty} ${esc(p.unit||'un.')}</b></td><td><b class="value-sales">${money(x.amount)}</b></td><td><button class="smallbtn secondary" onclick="adjustStock('${p.id}')">Stock</button> <button class="smallbtn danger" onclick="del('products','${p.id}')">Apagar</button></td></tr>`}).join('')||'<tr><td colspan="6" class="empty">Sem produtos.</td></tr>'}</table></div></section>`}
function addProduct(){const name=val('pname'),price=num('pprice'),cost=num('pcost'),stock=num('pstock'),min=num('pmin');if(!name||price<0||stock<0||min<0)return alert('Verifique os dados do produto.');db.products.push({id:id(),name,code:val('pcode')||'PRD-'+Date.now().toString().slice(-6),price,cost,stock,min,unit:val('punit')});save();render()}
function clients(){return `<h2>Clientes</h2><section class="panel"><h3>Novo cliente</h3><div class="row"><div><label>Nome</label><input id="cname"></div><div><label>Telefone</label><input id="cphone" inputmode="tel"></div></div><label>NIF (opcional)</label><input id="cnif"><div class="actions"><button onclick="addClient()">Guardar cliente</button></div></section><section class="panel"><table><tr><th>Nome</th><th>Telefone</th><th>NIF</th><th></th></tr>${db.clients.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td>${esc(c.nif)}</td><td><button class="smallbtn danger" onclick="del('clients','${c.id}')">Apagar</button></td></tr>`).join('')||'<tr><td colspan="4" class="empty">Sem clientes.</td></tr>'}</table></section>`}function addClient(){const name=val('cname');if(!name)return alert('Informe o nome.');db.clients.push({id:id(),name,phone:val('cphone'),nif:val('cnif')});save();render()}
function cartSubtotal(){return sum(saleCart,i=>i.qty*i.price)}function cartDiscount(){return sum(saleCart,i=>Math.min(i.qty*i.price,Math.max(0,i.discount||0)*i.qty*i.price/100))}function cartAfterItems(){return Math.max(0,cartSubtotal()-cartDiscount())}function cartTotal(){return Math.max(0,cartAfterItems()-Math.min(cartAfterItems(),Number(document.getElementById('saleDiscount')?.value)||0))}
function sales(){saleCart=[];return `<h2>Registar venda — V7.2</h2><section class="panel"><label>Cliente</label><select id="sclient"><option value="">Consumidor final</option>${db.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><div class="row"><div><label>Produto</label><select id="sproduct">${db.products.map(p=>`<option value="${p.id}">${esc(p.name)} — ${money(p.price)} (stock ${p.stock})</option>`).join('')}</select></div><div><label>Quantidade</label><input id="sqty" type="number" min="1" value="1"></div></div><div class="actions"><button class="secondary" onclick="addCartItem()">Adicionar produto</button></div><h3 style="margin-top:18px">Carrinho</h3><div id="cartArea">${cartHTML()}</div><div class="row"><div><label>Desconto geral (valor em Kz)</label><input id="saleDiscount" type="number" min="0" value="0" oninput="refreshCart()"></div><div><label>Forma de pagamento</label><select id="payMethod"><option>Dinheiro</option><option>Transferência</option><option>Multicaixa Express</option></select></div><div><label>Valor entregue / pago (Kz)</label><input id="payAmount" type="number" min="0" value="0" oninput="paymentPreview()"></div><div><label>Estado do pagamento</label><select id="payMode" onchange="paymentPreview()"><option value="normal">Pagamento normal</option><option value="partial">Pagamento parcial</option><option value="credit">Venda a crédito</option></select></div></div><div id="paymentInfo" class="metric" style="margin-top:10px">Total: ${money(0)}</div><div class="actions"><button onclick="finishSale()">Finalizar venda e emitir documento</button><button class="secondary" onclick="clearCart()">Limpar carrinho</button></div><p class="muted">Desconto por artigo em percentagem; desconto geral em Kz. O troco e a dívida são calculados automaticamente.</p></section><section class="panel"><h3>Histórico de vendas</h3><div class="tablewrap"><table><tr><th>N.º</th><th>Data</th><th>Cliente</th><th>Total</th><th>Pago</th><th>Dívida</th><th></th></tr>${db.sales.slice().reverse().map(s=>`<tr><td>${s.no}</td><td>${s.date}</td><td>${esc(s.clientName)}</td><td>${money(s.total)}</td><td>${money(s.paid)}</td><td class="${s.due>0?'bad':''}">${money(s.due)}</td><td><button class="smallbtn secondary" onclick="printSale('${s.id}')">Ver</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">Sem vendas.</td></tr>'}</table></div></section>`}
function cartHTML(){if(!saleCart.length)return '<p class="empty">Nenhum produto adicionado.</p>';return `<div class="tablewrap"><table><tr><th>Produto</th><th>Qtd.</th><th>Preço</th><th>Desc. %</th><th>Subtotal</th><th></th></tr>${saleCart.map((i,n)=>`<tr><td>${esc(i.name)}</td><td>${i.qty}</td><td>${money(i.price)}</td><td><input style="width:75px;padding:6px" type="number" min="0" max="100" value="${i.discount}" onchange="setItemDiscount(${n},this.value)"></td><td>${money(i.qty*i.price*(1-i.discount/100))}</td><td><button class="smallbtn danger" onclick="removeCartItem(${n})">X</button></td></tr>`).join('')}</table></div><div class="total-line"><span>Subtotal</span><b>${money(cartSubtotal())}</b></div><div class="total-line"><span>Descontos por produto</span><b>${money(cartDiscount())}</b></div><div class="total-line"><span>Total após desconto por produto</span><b>${money(cartAfterItems())}</b></div>`}
function refreshCart(){const a=document.getElementById('cartArea');if(a)a.innerHTML=cartHTML();paymentPreview()}function setItemDiscount(n,v){saleCart[n].discount=Math.max(0,Math.min(100,Number(v)||0));refreshCart()}function addCartItem(){const p=db.products.find(x=>x.id===val('sproduct')),qty=num('sqty');if(!p)return alert('Cadastre primeiro um produto.');if(qty<=0||qty>p.stock)return alert('Quantidade inválida ou stock insuficiente.');const old=saleCart.find(i=>i.productId===p.id),already=old?old.qty:0;if(qty+already>p.stock)return alert('Stock insuficiente. Disponível: '+p.stock);if(old)old.qty+=qty;else saleCart.push({productId:p.id,name:p.name,qty,price:Number(p.price),cost:Number(p.cost),discount:0});document.getElementById('sqty').value=1;refreshCart()}function removeCartItem(n){saleCart.splice(n,1);refreshCart()}function clearCart(){saleCart=[];refreshCart()}
function paymentPreview(){const info=document.getElementById('paymentInfo');if(!info)return;const total=cartTotal(),mode=val('payMode')||'normal',entered=Math.max(0,num('payAmount'));const paid=mode==='credit'?0:mode==='partial'?Math.min(total,entered):entered;const due=Math.max(0,total-Math.min(total,paid)),change=mode==='normal'?Math.max(0,entered-total):0;info.innerHTML=`<div class="total-line"><span>Total a pagar</span><b>${money(total)}</b></div><div class="total-line"><span>Valor considerado pago</span><b>${money(Math.min(total,paid))}</b></div><div class="total-line"><span>Troco</span><b>${money(change)}</b></div><div class="total-line"><span>Saldo em dívida</span><b class="${due?'bad':''}">${money(due)}</b></div>`}
function finishSale(){if(!saleCart.length)return alert('Adicione pelo menos um produto.');for(const i of saleCart){const p=db.products.find(x=>x.id===i.productId);if(!p||p.stock<i.qty)return alert('Stock insuficiente para '+i.name)}const subtotal=cartSubtotal(),itemDiscount=cartDiscount(),generalDiscount=Math.min(cartAfterItems(),Math.max(0,num('saleDiscount'))),total=Math.max(0,subtotal-itemDiscount-generalDiscount),mode=val('payMode')||'normal',method=val('payMethod')||'Dinheiro',entered=Math.max(0,num('payAmount'));if(generalDiscount>cartAfterItems())return alert('Desconto geral superior ao valor da venda.');if(mode==='normal'&&entered<total)return alert('O valor pago é inferior ao total. Escolha pagamento parcial ou crédito.');if(mode==='credit'&&entered>0)return alert('Para registar uma entrada numa venda a crédito, escolha pagamento parcial.');const paid=mode==='credit'?0:Math.min(total,entered),due=Math.max(0,total-paid),change=mode==='normal'?Math.max(0,entered-total):0;if(due>0&&!confirm('Registar saldo em dívida de '+money(due)+'?'))return;const c=db.clients.find(x=>x.id===val('sclient')),items=saleCart.map(i=>({...i,lineTotal:i.qty*i.price*(1-i.discount/100)}));const s={id:id(),no:'FT-'+String(db.sales.length+1).padStart(5,'0'),date:today(),clientId:c?.id||'',clientName:c?.name||'Consumidor final',clientNif:c?.nif||'',items,subtotal,itemDiscount,generalDiscount,total,paid,due,change,paymentMethod:method,payments:paid>0?[{date:today(),amount:paid,method}]:[]};items.forEach(i=>{const p=db.products.find(x=>x.id===i.productId);p.stock-=i.qty});db.sales.push(s);if(due>0)db.debts.push({id:id(),saleId:s.id,saleNo:s.no,clientName:s.clientName,clientId:s.clientId,original:total,paid,due,date:today(),status:'Aberta'});saleCart=[];save();render();printSale(s.id)}
function debtsPage(){const open=db.sales.filter(s=>Number(s.due)>0);const rows=db.sales.filter(s=>Number(s.due)>0||s.payments?.length).slice().reverse();return `<h2>Controlo de dívidas</h2><div class="page-legend"><span><i style="background:#c47a12"></i>Valores em dívida</span><span><i style="background:#176bba"></i>Clientes e quantidades</span><span><i style="background:#16845b"></i>Pagamentos recebidos</span></div><div class="grid"><div class="metric debt-metric">Total por receber<b class="value-debt">${money(outstanding())}</b></div><div class="metric">Clientes devedores<b class="value-info">${new Set(open.map(s=>s.clientId||s.clientName)).size}</b></div><div class="metric debt-metric">Vendas com saldo<b class="value-debt">${open.length}</b></div></div><section class="panel"><h3>Registar recebimento</h3><label>Venda / cliente</label><select id="debtSale">${open.map(s=>`<option value="${s.id}">${s.no} — ${esc(s.clientName)} — Em falta ${money(s.due)}</option>`).join('')}</select><div class="row"><div><label>Valor recebido (Kz)</label><input id="debtAmount" type="number" min="1" step="0.01" placeholder="Introduza o valor"></div><div><label>Forma de recebimento</label><select id="debtMethod"><option>Dinheiro</option><option>Transferência</option><option>Multicaixa Express</option></select></div></div><div class="actions"><button onclick="receiveDebt()" ${open.length?'':'disabled'}>Registar pagamento</button></div></section><section class="panel"><h3>Clientes devedores e produtos</h3><label>Pesquisar cliente, produto ou número da venda</label><input id="debtFilter" placeholder="Escreva para pesquisar..." oninput="filterDebtRows()"><div class="tablewrap"><table id="debtTable"><thead><tr><th>Venda / Data</th><th>Cliente</th><th>Produto(s)</th><th>Qtd.</th><th>Total</th><th>Já pago</th><th>Por pagar</th><th>Estado</th></tr></thead><tbody>${rows.map(s=>{const names=(s.items||[]).map(i=>esc(i.name)).join('<br>')||'—';const qty=(s.items||[]).map(i=>`<b class="value-quantity">${i.qty}</b>`).join('<br>')||'—';return `<tr data-search="${esc([s.no,s.clientName,...(s.items||[]).map(i=>i.name)].join(' ').toLowerCase())}"><td>${s.no}<br>${s.date}</td><td>${esc(s.clientName)}</td><td>${names}</td><td>${qty}</td><td><b>${money(s.total)}</b></td><td><b class="value-sales">${money(s.paid)}</b></td><td class="${s.due>0?'bad':''}"><b class="value-debt">${money(s.due)}</b></td><td>${s.due>0?'<span class="warning">Pendente</span>':'<span class="pill">Liquidada</span>'}</td></tr>`}).join('')||'<tr><td colspan="8" class="empty">Não existem dívidas registadas.</td></tr>'}</tbody></table></div></section>`}function filterDebtRows(){const q=(document.getElementById('debtFilter')?.value||'').toLowerCase();document.querySelectorAll('#debtTable tbody tr[data-search]').forEach(r=>r.style.display=r.dataset.search.includes(q)?'':'none')}
function receiveDebt(){const s=db.sales.find(x=>x.id===val('debtSale')),amount=num('debtAmount');if(!s)return alert('Não há venda em dívida seleccionada.');if(amount<=0||amount>s.due)return alert('Informe um valor válido, até '+money(s.due));const method=val('debtMethod');s.paid=Number(s.paid||0)+amount;s.due=Math.max(0,s.total-s.paid);s.payments=s.payments||[];s.payments.push({date:today(),amount,method});const d=db.debts.find(x=>x.saleId===s.id);if(d){d.paid=s.paid;d.due=s.due;d.status=s.due?'Aberta':'Liquidada'}db.payments.push({id:id(),saleId:s.id,date:today(),amount,method});save();render();alert('Recebimento registado. Saldo em falta: '+money(s.due))}
function returnableQty(s,item){const done=sum((db.returns||[]).filter(r=>r.saleId===s.id),r=>sum((r.items||[]).filter(x=>x.productId===item.productId),x=>Number(x.qty)||0));return Math.max(0,Number(item.qty||0)-done)}
function returnableGross(s,item){const qty=returnableQty(s,item),unit=Number(item.lineTotal??(item.qty*item.price))/Math.max(1,Number(item.qty)||1);return qty*unit}
function returnsPage(){db.returns=Array.isArray(db.returns)?db.returns:[];const eligible=db.sales.filter(s=>(s.items||[]).some(i=>returnableQty(s,i)>0));const totalRefund=sum(db.returns,r=>Number(r.refund)||0);const totalUnits=sum(db.returns,r=>sum(r.items||[],i=>Number(i.qty)||0));const totalGoods=sum(db.returns,r=>Number(r.gross)||0);return `<h2>Devoluções e reembolsos</h2><div class="page-legend"><span><i style="background:#7652a8"></i>Devoluções registadas</span><span><i style="background:#176bba"></i>Unidades devolvidas</span><span><i style="background:#bd3b3b"></i>Valores reembolsados</span></div><div class="grid"><div class="metric return-metric">Devoluções registadas<b class="value-return">${db.returns.length}</b></div><div class="metric refund-metric">Total reembolsado<b class="value-refund">${money(totalRefund)}</b></div><div class="metric">Produtos devolvidos<b class="value-quantity">${totalUnits}</b></div><div class="metric return-metric">Valor total devolvido<b class="value-return">${money(totalGoods)}</b></div></div><section class="panel"><h3>Registar devolução</h3><label>Venda original</label><select id="returnSale" onchange="updateReturnItems()"><option value="">Seleccione uma venda</option>${eligible.map(s=>`<option value="${s.id}">${s.no} — ${esc(s.clientName)} — ${s.date} — ${money(s.total)}</option>`).join('')}</select><div class="row"><div><label>Produto comprado</label><select id="returnProduct" onchange="previewReturn()"><option value="">Seleccione primeiro a venda</option></select></div><div><label>Quantidade a devolver</label><input id="returnQty" type="number" min="1" value="1" oninput="previewReturn()"></div></div><div class="row"><div><label>Motivo da devolução</label><select id="returnReason"><option>Produto com defeito</option><option>Produto errado</option><option>Cliente desistiu da compra</option><option>Produto danificado</option><option>Outro motivo</option></select></div><div><label>Destino do reembolso</label><select id="returnMethod"><option>Dinheiro</option><option>Transferência</option><option>Multicaixa Express</option><option>Crédito na loja</option></select></div></div><label><input id="restockReturn" type="checkbox" checked style="width:auto;margin-right:7px">Produto em condições de voltar ao stock</label><div id="returnPreview" class="metric" style="margin-top:10px">Seleccione uma venda e um produto para calcular os valores.</div><div class="actions"><button onclick="recordReturn(false)" ${eligible.length?'':'disabled'}>Registar devolução parcial</button><button class="danger" onclick="recordReturn(true)" ${eligible.length?'':'disabled'}>Devolver toda a compra</button></div><p class="muted">O reembolso em dinheiro nunca ultrapassa o valor efectivamente pago. A parte ainda não paga é abatida à dívida. Cada unidade só pode ser devolvida uma vez.</p></section><section class="panel"><h3>Histórico de devoluções</h3><div class="tablewrap"><table><tr><th>Data</th><th>Venda</th><th>Cliente</th><th>Produto(s)</th><th>Qtd.</th><th>Valor devolvido</th><th>Reembolso</th><th>Destino</th><th></th></tr>${db.returns.slice().reverse().map(r=>`<tr><td>${r.date}</td><td>${esc(r.saleNo)}</td><td>${esc(r.clientName)}</td><td>${(r.items||[]).map(i=>esc(i.name)).join('<br>')}</td><td>${(r.items||[]).map(i=>`<b class="value-quantity">${i.qty}</b>`).join('<br>')}</td><td><b class="value-return">${money(r.gross)}</b></td><td><b class="value-refund">${money(r.refund)}</b></td><td>${esc(r.method)}</td><td><button class="smallbtn secondary" onclick="printReturn('${r.id}')">Comprovativo</button></td></tr>`).join('')||'<tr><td colspan="9" class="empty">Ainda não existem devoluções.</td></tr>'}</table></div></section>`}
function updateReturnItems(){const s=db.sales.find(x=>x.id===val('returnSale')),sel=document.getElementById('returnProduct');if(!sel)return;sel.innerHTML=s?'<option value="">Seleccione o produto</option>'+(s.items||[]).filter(i=>returnableQty(s,i)>0).map((i,n)=>`<option value="${i.productId||n}">${esc(i.name)} — disponível para devolução: ${returnableQty(s,i)}</option>`).join(''):'<option value="">Seleccione primeiro a venda</option>';previewReturn()}
function selectedReturnItem(s){const key=val('returnProduct');return (s?.items||[]).find((i,n)=>(i.productId||String(n))===key)}
function calculateReturn(s,item,qty){if(!s||!item||qty<=0)return {gross:0,refund:0,debtReduction:0};const unit=Number(item.lineTotal??(item.qty*item.price))/Math.max(1,Number(item.qty)||1),gross=unit*qty,ratio=Number(s.total)>0?Math.min(1,Math.max(0,Number(s.paid||0)/Number(s.total))):0,refund=Math.min(Number(s.paid||0),gross*ratio);return {gross,refund,debtReduction:Math.max(0,gross-refund)}}
function previewReturn(){const out=document.getElementById('returnPreview');if(!out)return;const s=db.sales.find(x=>x.id===val('returnSale')),item=selectedReturnItem(s),qty=num('returnQty'),max=item&&s?returnableQty(s,item):0;if(!item){out.textContent='Seleccione uma venda e um produto.';return}const c=calculateReturn(s,item,Math.min(qty,max));out.innerHTML=`<div class="total-line"><span>Quantidade máxima disponível</span><b>${max}</b></div><div class="total-line"><span>Valor da mercadoria devolvida</span><b>${money(c.gross)}</b></div><div class="total-line"><span>Valor a reembolsar</span><b>${money(c.refund)}</b></div><div class="total-line"><span>Redução da dívida</span><b>${money(c.debtReduction)}</b></div>`}
function recordReturn(all){const s=db.sales.find(x=>x.id===val('returnSale'));if(!s)return alert('Seleccione a venda original.');let chosen=[];if(all){chosen=(s.items||[]).map(i=>({item:i,qty:returnableQty(s,i)})).filter(x=>x.qty>0)}else{const item=selectedReturnItem(s),qty=num('returnQty');if(!item)return alert('Seleccione o produto.');const max=returnableQty(s,item);if(qty<=0||qty>max)return alert('Quantidade inválida. Máximo disponível: '+max);chosen=[{item,qty}]};if(!chosen.length)return alert('Esta venda já não tem produtos disponíveis para devolução.');const gross=chosen.reduce((n,x)=>n+calculateReturn(s,x.item,x.qty).gross,0),refund=chosen.reduce((n,x)=>n+calculateReturn(s,x.item,x.qty).refund,0),debtReduction=Math.max(0,gross-refund);const reason=all?'Devolução total da compra':val('returnReason');if(!confirm('Confirmar devolução de '+money(gross)+'? Reembolso: '+money(refund)+'.'))return;const items=chosen.map(x=>({productId:x.item.productId,name:x.item.name,qty:x.qty,unitPrice:Number(x.item.lineTotal??x.item.qty*x.item.price)/Math.max(1,Number(x.item.qty)||1),gross:calculateReturn(s,x.item,x.qty).gross}));chosen.forEach(x=>{const item=x.item,oldQty=Number(item.qty)||0,unit=Number(item.lineTotal??oldQty*item.price)/Math.max(1,oldQty);item.qty=oldQty-x.qty;item.lineTotal=Math.max(0,unit*item.qty);if(document.getElementById('restockReturn')?.checked){const p=db.products.find(p=>p.id===item.productId);if(p)p.stock=Number(p.stock||0)+x.qty}});s.total=Math.max(0,Number(s.total||0)-gross);s.paid=Math.max(0,Number(s.paid||0)-refund);s.due=Math.max(0,Number(s.due||0)-debtReduction);s.items=s.items.filter(i=>Number(i.qty)>0);s.returnedGross=Number(s.returnedGross||0)+gross;const r={id:id(),date:today(),saleId:s.id,saleNo:s.no,clientName:s.clientName,items,gross,refund,debtReduction,method:val('returnMethod'),reason,restocked:!!document.getElementById('restockReturn')?.checked};db.returns=db.returns||[];db.returns.push(r);const d=db.debts.find(x=>x.saleId===s.id);if(d){d.original=s.total;d.paid=s.paid;d.due=s.due;d.status=s.due?'Aberta':'Liquidada'}save();render();alert('Devolução registada. Reembolso: '+money(refund)+'; dívida reduzida: '+money(debtReduction)+'.')}
function printReturn(rid){const r=(db.returns||[]).find(x=>x.id===rid);if(!r)return;const a=document.getElementById('receiptArea');a.classList.remove('hide');a.innerHTML=`<div class="receipt"><h2>${esc(db.settings.name)}</h2><p class="center">${esc(db.settings.address)}<br>NIF: ${esc(db.settings.nif)}</p><hr><h3 class="center">COMPROVATIVO DE DEVOLUÇÃO</h3><p>N.º venda: ${esc(r.saleNo)}<br>Data: ${r.date}<br>Cliente: ${esc(r.clientName)}<br>Motivo: ${esc(r.reason)}</p><table><tr><th>Produto</th><th>Qtd.</th><th>Valor</th></tr>${r.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.qty}</td><td>${money(i.gross)}</td></tr>`).join('')}</table><p>Valor da mercadoria: ${money(r.gross)}<br>Redução da dívida: ${money(r.debtReduction)}<br>Forma: ${esc(r.method)}</p><h3 style="text-align:right">REEMBOLSO: ${money(r.refund)}</h3><p class="center">${r.restocked?'Produtos reintegrados no stock.':'Produtos não reintegrados no stock.'}</p><div class="actions no-print"><button onclick="window.print()">Imprimir / Guardar PDF</button><button class="secondary" onclick="document.getElementById('receiptArea').classList.add('hide')">Fechar</button></div></div>`;window.scrollTo(0,0)}
function expenses(){return `<h2>Despesas</h2><section class="panel"><div class="row"><div><label>Descrição</label><input id="edesc"></div><div><label>Valor (Kz)</label><input id="eamount" type="number" min="0"></div></div><label>Categoria</label><select id="ecat"><option>Transporte</option><option>Renda</option><option>Energia/Água</option><option>Salários</option><option>Compras</option><option>Outras</option></select><div class="actions"><button onclick="addExpense()">Registar despesa</button></div></section><section class="panel"><table><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Valor</th><th></th></tr>${db.expenses.slice().reverse().map(e=>`<tr><td>${e.date}</td><td>${esc(e.desc)}</td><td>${esc(e.cat)}</td><td>${money(e.amount)}</td><td><button class="smallbtn danger" onclick="del('expenses','${e.id}')">Apagar</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Sem despesas.</td></tr>'}</table></section>`}function addExpense(){const desc=val('edesc'),amount=num('eamount');if(!desc||amount<=0)return alert('Informe a descrição e um valor válido.');db.expenses.push({id:id(),date:today(),desc,amount,cat:val('ecat')});save();render()}
function invoices(){return `<h2>Facturas e recibos</h2><section class="panel"><p>Documentos gerados a partir das vendas registadas.</p><table><tr><th>N.º</th><th>Data</th><th>Cliente</th><th>Total</th><th>Em falta</th><th>Documento</th></tr>${db.sales.slice().reverse().map(s=>`<tr><td>${s.no}</td><td>${s.date}</td><td>${esc(s.clientName)}</td><td>${money(s.total)}</td><td>${money(s.due)}</td><td><button class="smallbtn" onclick="printSale('${s.id}')">Imprimir</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">Ainda não existem documentos.</td></tr>'}</table></section><p class="muted">Documento para controlo comercial interno; não substitui validação ou certificação fiscal oficial.</p>`}
function reports(){const rev=revenue(),cost=costTotal(),ex=expensesTotal(),due=outstanding(),received=sum(db.sales,s=>s.paid||0);return `<h2>Relatórios e análise financeira</h2><div class="page-legend"><span><i style="background:#16845b"></i>Receitas e recebimentos</span><span><i style="background:#bd3b3b"></i>Custos e despesas</span><span><i style="background:#176bba"></i>Lucro e indicadores</span><span><i style="background:#c47a12"></i>Dívidas</span><span><i style="background:#7652a8"></i>Classificação</span></div><div class="grid"><div class="metric report-sales">Vendas / receita<b class="value-sales">${money(rev)}</b></div><div class="metric report-cost">Custo das mercadorias<b class="value-expense">${money(cost)}</b></div><div class="metric report-cost">Despesas<b class="value-expense">${money(ex)}</b></div><div class="metric report-profit">Lucro estimado<b class="value-info">${money(rev-cost-ex)}</b></div><div class="metric report-debt">Dívidas por receber<b class="value-debt">${money(due)}</b></div><div class="metric report-received">Recebido<b class="value-sales">${money(received)}</b></div></div><section class="panel"><div class="row"><div><h3>Gráfico de vendas</h3><p class="muted">Actualiza com os registos de vendas.</p></div><div><label>Período</label><select id="chartPeriod" onchange="drawReportChart()"><option value="7">Últimos 7 dias</option><option value="30">Últimos 30 dias</option><option value="all">Todo o histórico</option></select></div></div><canvas id="reportChart" height="220" style="width:100%;max-width:100%"></canvas><p id="chartEmpty" class="muted"></p></section><section class="panel"><h3>Resumo por data</h3><div class="tablewrap"><table><tr><th>Data</th><th>Vendas</th><th>Receita</th><th>Recebido</th></tr>${[...new Set(db.sales.map(s=>s.date))].sort().reverse().map(d=>{const a=db.sales.filter(s=>s.date===d);return `<tr><td>${d}</td><td><b class="value-quantity">${a.length}</b></td><td><b class="value-sales">${money(sum(a,s=>s.total))}</b></td><td><b class="value-sales">${money(sum(a,s=>s.paid||0))}</b></td></tr>`}).join('')||'<tr><td colspan="4" class="empty">Sem movimento.</td></tr>'}</table></div></section><section class="panel"><h3>Vendas por produto — quantidade e valor</h3><p class="muted">A quantidade corresponde às unidades efectivamente vendidas, descontando devoluções registadas. O valor é o total líquido dos artigos nas vendas.</p><div class="tablewrap"><table><tr><th>Posição</th><th>Produto</th><th>Quantidade vendida</th><th>Valor total vendido</th></tr>${productStatsAll().map((x,i)=>`<tr><td><b class="value-neutral">${i+1}.º</b></td><td>${esc(x.product.name)}</td><td><b class="value-quantity">${x.qty} ${esc(x.product.unit||'un.')}</b></td><td><b class="value-sales">${money(x.amount)}</b></td></tr>`).join('')||'<tr><td colspan="4" class="empty">Sem produtos cadastrados.</td></tr>'}</table></div></section><div class="actions"><button onclick="exportCSV()">Exportar vendas CSV</button><button class="secondary" onclick="backup()">Cópia de segurança JSON</button></div>`}
function drawReportChart(){const cv=document.getElementById('reportChart');if(!cv)return;let data=db.sales.slice(),period=val('chartPeriod')||'7';if(period!=='all'){const cut=new Date();cut.setDate(cut.getDate()-Number(period)+1);const from=new Date(cut.getTime()-cut.getTimezoneOffset()*60000).toISOString().slice(0,10);data=data.filter(s=>s.date>=from)}const grouped={};data.forEach(s=>grouped[s.date]=(grouped[s.date]||0)+s.total);const labels=Object.keys(grouped).sort(),vals=labels.map(k=>grouped[k]),empty=document.getElementById('chartEmpty');const w=Math.max(cv.parentElement.clientWidth-30,300),h=220,dpr=window.devicePixelRatio||1;cv.width=w*dpr;cv.height=h*dpr;cv.style.height=h+'px';const c=cv.getContext('2d');c.scale(dpr,dpr);c.clearRect(0,0,w,h);if(!labels.length){empty.textContent='Ainda não existem vendas no período seleccionado.';return}empty.textContent='Valores em '+db.settings.currency;const max=Math.max(...vals,1),left=52,bottom=35,top=12,ph=h-top-bottom,pw=w-left-10;c.font='11px system-ui';c.fillStyle=getComputedStyle(document.body).getPropertyValue('--muted');c.strokeStyle=getComputedStyle(document.body).getPropertyValue('--line');for(let j=0;j<=4;j++){const y=top+ph*j/4;c.beginPath();c.moveTo(left,y);c.lineTo(w-8,y);c.stroke();c.fillText((max*(1-j/4)).toFixed(0),3,y+4)}const slot=pw/labels.length,bw=Math.max(5,slot*.58);vals.forEach((v,i)=>{const bh=ph*v/max,x=left+i*slot+(slot-bw)/2,y=top+ph-bh;c.fillStyle=getComputedStyle(document.body).getPropertyValue('--blue');c.fillRect(x,y,bw,bh);c.fillStyle=getComputedStyle(document.body).getPropertyValue('--muted');c.save();c.translate(x+bw/2,h-7);c.rotate(-.35);c.textAlign='right';c.fillText(labels[i].slice(5),0,0);c.restore()})}
function settings(){const shown=db.settings.showMetrics||['Vendas realizadas','Lucro estimado','Despesas registadas','Dívidas por receber','Produtos cadastrados','Clientes','Vendas registadas','Stock total'];const metrics=['Vendas realizadas','Lucro estimado','Despesas registadas','Dívidas por receber','Produtos cadastrados','Clientes','Vendas registadas','Stock total'];return `<h2>Configurações do sistema</h2><section class="panel"><h3>🎨 Aparência e personalização</h3><div class="row"><div><label>Tema do sistema</label><select id="themeChoice" onchange="setTheme(this.value)"><option value="azul" ${(db.settings.theme||'azul')==='azul'?'selected':''}>Azul profissional</option><option value="verde" ${db.settings.theme==='verde'?'selected':''}>Verde empresarial</option><option value="roxo" ${db.settings.theme==='roxo'?'selected':''}>Roxo moderno</option><option value="escuro" ${db.settings.theme==='escuro'?'selected':''}>Modo escuro</option></select></div><div><label>Tamanho do texto</label><select id="fontChoice" onchange="setFontSize(this.value)"><option value="14" ${String(db.settings.fontSize||15)==='14'?'selected':''}>Pequeno</option><option value="15" ${String(db.settings.fontSize||15)==='15'?'selected':''}>Normal</option><option value="17" ${String(db.settings.fontSize||15)==='17'?'selected':''}>Grande</option><option value="18" ${String(db.settings.fontSize||15)==='18'?'selected':''}>Muito grande</option></select></div></div><label>Cor de destaque</label><div class="color-row">${[['#1676c5','Azul'],['#16845b','Verde'],['#8b5ac2','Roxo'],['#d97706','Laranja'],['#c13e62','Rosa'],['#202b3b','Grafite']].map(([c,n])=>`<button class="color-dot ${db.settings.accent===c?'selected':''}" style="background:${c}" title="${n}" onclick="setAccent('${c}')"></button>`).join('')}</div><p class="muted">A alteração é aplicada imediatamente e guardada neste dispositivo.</p></section><section class="panel"><h3>📊 Painel principal</h3><p class="muted">Escolha os indicadores que pretende visualizar no início.</p><div class="settings-grid">${metrics.map(m=>`<label class="setting-tile"><input type="checkbox" style="width:auto;margin-right:8px" ${shown.includes(m)?'checked':''} onchange="toggleMetric('${m}',this.checked)"><strong>${m}</strong></label>`).join('')}</div></section><section class="panel"><h3>🏢 Dados da empresa e documentos</h3><div class="row"><div><label>Nome da empresa</label><input id="setname" value="${esc(db.settings.name)}"></div><div><label>NIF</label><input id="setnif" value="${esc(db.settings.nif)}"></div><div><label>Endereço</label><input id="setaddress" value="${esc(db.settings.address)}"></div><div><label>Moeda</label><input id="setcurrency" value="${esc(db.settings.currency)}"></div></div><div class="actions"><button onclick="saveSettings()">Guardar dados da empresa</button></div><p class="muted">O nome do sistema é independente do nome comercial da sua empresa.</p></section><section class="panel"><h3>🔐 Segurança e sessão</h3><label>Bloqueio automático por inactividade</label><select id="autoLockChoice" onchange="setAutoLock(this.value)"><option value="0" ${Number(db.settings.autoLock||0)===0?'selected':''}>Desactivado</option><option value="1" ${Number(db.settings.autoLock)===1?'selected':''}>Após 1 minuto</option><option value="5" ${Number(db.settings.autoLock)===5?'selected':''}>Após 5 minutos</option><option value="10" ${Number(db.settings.autoLock)===10?'selected':''}>Após 10 minutos</option><option value="15" ${Number(db.settings.autoLock)===15?'selected':''}>Após 15 minutos</option></select><label>PIN actual</label><input id="oldpin" type="password" inputmode="numeric"><label>Novo PIN (4 a 12 dígitos)</label><input id="newpin" type="password" inputmode="numeric"><label>Confirmar novo PIN</label><input id="confirmpin" type="password" inputmode="numeric"><div class="actions"><button onclick="changePin()">Actualizar PIN</button><button class="secondary" onclick="logout()">Bloquear agora</button></div></section><section class="panel"><h3>💾 Cópias de segurança e manutenção</h3><p class="muted">Faça cópias regularmente. Restaurar uma cópia substitui os dados actuais.</p><input type="file" id="restorefile" accept="application/json"><div class="actions"><button class="secondary" onclick="backup()">Exportar cópia</button><button class="secondary" onclick="restore()">Restaurar cópia</button><button class="danger" onclick="resetApp()">Repor sistema</button></div></section><section class="panel"><h3>ℹ️ Sobre o sistema</h3><div class="grid"><div class="metric">Aplicação<b>Meu Gestor de Negócios</b></div><div class="metric">Versão<b>8.0</b></div><div class="metric">Modo de funcionamento<b>Offline</b></div><div class="metric">Armazenamento<b>Neste dispositivo</b></div></div><p class="muted">Os dados permanecem no dispositivo e no navegador utilizado. Limpar os dados do navegador pode apagá-los; mantenha uma cópia de segurança.</p></section>`}
function setTheme(t){db.settings.theme=t;save();document.body.dataset.theme=t;render()}
function setAccent(c){db.settings.accent=c;save();render()}
function setFontSize(n){db.settings.fontSize=Number(n);save();render()}
function setAutoLock(n){db.settings.autoLock=Number(n);save();resetIdleTimer()}
function toggleMetric(name,on){db.settings.showMetrics=db.settings.showMetrics||['Vendas realizadas','Lucro estimado','Despesas registadas','Dívidas por receber','Produtos cadastrados','Clientes','Vendas registadas','Stock total'];db.settings.showMetrics=on?[...new Set([...db.settings.showMetrics,name])]:db.settings.showMetrics.filter(x=>x!==name);save()}
function saveSettings(){db.settings.name=val('setname')||'Minha Empresa';db.settings.nif=val('setnif');db.settings.address=val('setaddress');db.settings.currency=val('setcurrency')||'Kz';save();render()}
let idleTimer=null;function resetIdleTimer(){clearTimeout(idleTimer);const mins=Number(db.settings.autoLock||0);if(mins>0&&!document.getElementById('app').classList.contains('hide'))idleTimer=setTimeout(()=>logout(),mins*60000)}['click','keydown','touchstart','scroll'].forEach(ev=>document.addEventListener(ev,()=>{if(!document.getElementById('app').classList.contains('hide'))resetIdleTimer()},{passive:true}));
function changePin(){const old=val('oldpin'),p=val('newpin'),confirmPin=val('confirmpin');if(old!==db.settings.pin)return alert('O PIN actual está incorrecto.');if(!/^\d{4,12}$/.test(p))return alert('O novo PIN deve ter entre 4 e 12 dígitos.');if(p!==confirmPin)return alert('A confirmação não corresponde.');db.settings.pin=p;save();alert('PIN alterado com sucesso.');render()}
function adjustStock(pid){const p=db.products.find(x=>x.id===pid);if(!p)return;const q=prompt('Quantidade a adicionar (negativo para retirar):','0');if(q===null)return;const n=Number(q);if(!Number.isFinite(n)||p.stock+n<0)return alert('Quantidade inválida.');p.stock+=n;db.stockMoves.push({date:today(),product:p.name,qty:n});save();render()}function del(type,pid){if(!confirm('Tem certeza que deseja apagar este registo?'))return;db[type]=db[type].filter(x=>x.id!==pid);save();render()}
function printSale(sid){const s=db.sales.find(x=>x.id===sid);if(!s)return;const area=document.getElementById('receiptArea');area.classList.remove('hide');area.innerHTML=`<div class="receipt"><h2>${esc(db.settings.name)}</h2><p class="center">${esc(db.settings.address)}<br>NIF: ${esc(db.settings.nif)}</p><hr><h3 class="center">FACTURA / RECIBO</h3><p>N.º: ${s.no}<br>Data: ${s.date}<br>Cliente: ${esc(s.clientName)}<br>${s.clientNif?'NIF: '+esc(s.clientNif):''}</p><table><tr><th>Descrição</th><th>Qtd.</th><th>Preço</th><th>Desc. %</th><th>Total</th></tr>${s.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.qty}</td><td>${money(i.price)}</td><td>${i.discount||0}%</td><td>${money(i.lineTotal??i.qty*i.price)}</td></tr>`).join('')}</table><p>Subtotal: ${money(s.subtotal)}<br>Desconto nos produtos: ${money(s.itemDiscount)}<br>Desconto geral: ${money(s.generalDiscount)}</p><h3 style="text-align:right">TOTAL: ${money(s.total)}</h3><p>Forma de pagamento: ${esc(s.paymentMethod)}<br>Pago: ${money(s.paid)}<br>Troco: ${money(s.change)}<br>Saldo em dívida: ${money(s.due)}</p>${(s.payments||[]).length?'<h3>Histórico de pagamentos</h3>'+s.payments.map(p=>`<p>${p.date} — ${esc(p.method)} — ${money(p.amount)}</p>`).join(''):''}<p class="center">Documento para controlo comercial interno.<br>Obrigado pela preferência!</p><div class="actions no-print"><button onclick="window.print()">Imprimir / Guardar PDF</button><button class="secondary" onclick="document.getElementById('receiptArea').classList.add('hide')">Fechar</button></div></div>`;window.scrollTo(0,0)}
function exportCSV(){const rows=[['Numero','Data','Cliente','Subtotal','Descontos','Total','Pago','Divida','Forma pagamento'],...db.sales.map(s=>[s.no,s.date,s.clientName,s.subtotal,s.itemDiscount+s.generalDiscount,s.total,s.paid,s.due,s.paymentMethod])];download('vendas_v6.csv','text/csv;charset=utf-8',rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(';')).join('\n'))}function backup(){download('minha-empresa-backup-v6.json','application/json',JSON.stringify(db,null,2))}function restore(){const f=document.getElementById('restorefile').files[0];if(!f)return alert('Escolha um ficheiro JSON.');const r=new FileReader();r.onload=()=>{try{db=normalize(JSON.parse(r.result));save();render();alert('Cópia restaurada.')}catch(e){alert('Ficheiro inválido.')}};r.readAsText(f)}function resetApp(){if(!confirm('Apagar todos os dados? Esta acção não pode ser desfeita.'))return;db=normalize(initial);save();render()}function download(name,type,data){if(window.Android&&typeof window.Android.saveTextFile==='function'){window.Android.saveTextFile(name,type,String(data));return}const a=document.createElement('a'),u=URL.createObjectURL(new Blob([data],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
